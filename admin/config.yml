backend:
  name: github
  repo: hashin/udfgov
  branch: main
  base_url: https://www.udfgov.cc

# Netlify's editorial_workflow (Draft -> In Review -> Ready) depends on GitHub's
# Search API to list drafts, which Git Gateway blocks ("this part of GitHub's API
# has been restricted") -- a hard incompatibility, not a config issue. So entries
# publish directly, and review happens via the "Draft" field below instead: a
# checked entry still builds but isn't linked from the site's public listings,
# so an editor can review it at its direct URL before unchecking it to go live.
publish_mode: simple

# Most content creators write from a phone. Decap's default split-screen editor
# (form + live preview side by side) squeezes each pane to near-unusable width on
# a phone screen, so drop the preview pane entirely -- the form then gets the full
# screen width. Nothing is lost: saving as a draft still gives a real preview link
# (see the Draft field below).
editor:
  preview: false

media_folder: "src/uploads"
public_folder: "/uploads"

site_url: https://www.udfgov.cc
display_url: https://www.udfgov.cc

collections:
  - name: "initiatives"
    label: "Initiatives & Achievements"
    label_singular: "Initiative"
    folder: "src/initiatives"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    format: "frontmatter"
    extension: "md"
    preview_path: "initiatives/{{slug}}/"
    sortable_fields: ["title", "date", "draft"]
    view_filters:
      - label: "Pending review"
        field: draft
        pattern: true
      - label: "Published"
        field: draft
        pattern: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "initiative.njk" }
      - label: "Draft (hide from public listings)"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "Leave checked while writing/reviewing -- the page still builds so you can preview it by direct link, but it won't appear on the site's listing pages. Uncheck once an editor has reviewed it to make it public."
      - { label: "Title", name: "title", widget: "string", hint: "Shown as the page heading and the WhatsApp/social link title." }
      - label: "Poster image"
        name: "poster"
        widget: "image"
        hint: "This becomes the hero image on the page AND the image shown when the link is shared on WhatsApp/social. Use a landscape image, ideally 1200x630px."
      - label: "Summary"
        name: "summary"
        widget: "text"
        hint: "One punchy sentence. Shown under the headline and as the WhatsApp/social preview text."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Infrastructure", "Education", "Health", "Welfare", "Agriculture", "Economy", "Other"]
      - label: "Minister"
        name: "minister"
        widget: "relation"
        collection: "ministers"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
        hint: "The minister responsible for this initiative. Links this page from their profile on /ministers/."
        required: false
      - label: "Ministry / portfolio"
        name: "ministry"
        widget: "select"
        hint: "The specific portfolio this falls under -- matters when a minister holds several portfolios."
        required: false
        options:
          - "Agriculture"
          - "Animal Husbandry"
          - "Archaeology"
          - "Backward Classes Welfare"
          - "Civil Supplies"
          - "Co-operation"
          - "Coir"
          - "Consumer Affairs"
          - "Culture"
          - "Dairy Development"
          - "Devaswom"
          - "Electricity"
          - "Environment"
          - "Excise"
          - "Finance"
          - "Fisheries"
          - "Food"
          - "Forests and Wildlife"
          - "General Administration"
          - "General Education"
          - "Health and Family Welfare"
          - "Higher Education"
          - "Home"
          - "Housing"
          - "IT"
          - "Industries"
          - "Information Technology"
          - "Labour"
          - "Law"
          - "Local Self Governments"
          - "Minority Welfare"
          - "Other"
          - "Parliamentary Affairs"
          - "Personnel"
          - "Planning"
          - "Ports"
          - "Public Works"
          - "Revenue"
          - "Scheduled Castes"
          - "Scheduled Tribes"
          - "Science & Technology"
          - "Skill Development"
          - "Social Justice"
          - "Sports"
          - "Technical Education"
          - "Tourism"
          - "Transport"
          - "Universities"
          - "Vigilance"
          - "Water Resources"
          - "Women & Child Development"
          - "Youth Affairs"
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Use the image icon in the toolbar to add photos anywhere in the text. Use the \"+\" block-insert menu to add a \"YouTube video\" block -- paste the video's normal link or the embed code from YouTube's Share button."

  - name: "ministers"
    label: "Council of Ministers"
    label_singular: "Minister"
    folder: "src/ministers"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    preview_path: "ministers/{{slug}}/"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "minister.njk" }
      - { label: "Name", name: "name", widget: "string", hint: "e.g. V. D. Satheesan" }
      - label: "Designation"
        name: "designation"
        widget: "select"
        options: ["Chief Minister", "Minister"]
        default: "Minister"
      - label: "Portfolios"
        name: "portfolios"
        widget: "string"
        hint: "Comma-separated, e.g. \"Health and Family Welfare, Devaswom\""
      - { label: "Party", name: "party", widget: "string", required: false }
      - { label: "Constituency", name: "constituency", widget: "string", required: false }
      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        hint: "Use a verified, current official photo -- shows an initials placeholder until one is uploaded. Square, at least 400x400px works best."
      - label: "Order"
        name: "order"
        widget: "number"
        hint: "Controls listing order on /ministers/ -- Chief Minister should be 0, then ascending."
        default: 99
